# Builds the documentation site with MkDocs and deploys it to GitHub Pages.
#
# The API reference is generated from the sources by mkdocstrings, which reads
# them statically (with griffe): the build needs no intrepid library, so unlike
# the test workflow it needs no token for the private repository.
#
# GitHub Pages must be set, once, to the "GitHub Actions" source
# (Settings -> Pages -> Build and deployment -> Source: GitHub Actions).

name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - intrepyd/**
      - mkdocs.yml
      - pyproject.toml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts; do not cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Dependency groups need pip 25.1 or newer
      - name: Install the documentation requirements
        run: |
          python -m pip install --upgrade "pip>=25.1"
          python -m pip install -e . --group docs

      - name: Build the site
        run: python -m mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
