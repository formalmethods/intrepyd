# The package metadata. setup.py only adds what cannot be said here: that the
# wheels carry a native library, and how they are tagged.

[build-system]
# 77 is the first setuptools with PEP 639 license expressions
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "intrepyd"
dynamic = ["version"]
description = "Simulator and model checkers for circuits, as a python API"
readme = {file = "docs/pypi.md", content-type = "text/markdown"}
authors = [{name = "Roberto Bruttomesso", email = "roberto.bruttomesso@gmail.com"}]
maintainers = [{name = "Roberto Bruttomesso", email = "roberto.bruttomesso@gmail.com"}]
# intrepyd itself is free for noncommercial purposes, under the PolyForm
# Noncommercial License, and under a commercial license for anything else; the
# intrepid library bundled in the wheels is proprietary, and may be used as
# part of intrepyd within the terms of its license; z3, linked into it, is MIT
# (see CREDITS.md)
license = "PolyForm-Noncommercial-1.0.0 AND LicenseRef-Intrepid AND MIT"
license-files = ["LICENSE.md", "CREDITS.md", "intrepyd/LICENSE.intrepid"]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    # The pin is deliberate: the checked in lexers and parsers under
    # lustre2py/, formula2py/ and iec611312py/ are generated by ANTLR 4.9.1,
    # and the runtime has to match the generator.
    "antlr4-python3-runtime==4.9.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
# intrepyd.plots
plots = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/formalmethods/intrepyd"
Documentation = "https://formalmethods.github.io/intrepyd/"
Source = "https://github.com/formalmethods/intrepyd"
Issues = "https://github.com/formalmethods/intrepyd/issues"
Changelog = "https://github.com/formalmethods/intrepyd/blob/main/CHANGELOG.md"

# What developing intrepyd needs on top of the package, for
#   pip install -e . --group dev
# (pip 25.1 or newer). None of it is installed with intrepyd.
[dependency-groups]
lint = ["pylint"]
# Static type checking of the annotated public API.
# mypy reads the sources statically, so this needs no intrepid library.
typecheck = ["mypy"]
release = ["build", "packaging"]
# The documentation site (make build_docs / serve_docs, and the docs workflow).
# mkdocstrings reads the sources statically, so this needs no intrepid library.
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]
dev = [
    {include-group = "lint"},
    {include-group = "typecheck"},
    {include-group = "release"},
    {include-group = "docs"},
    "coverage",
    "matplotlib",
]

[tool.mypy]
python_version = "3.11"
# The modules whose public API is annotated so far;
# the rest of the package is type-checked as it gets annotated. Imports into
# unlisted modules are followed for types but their own errors are silenced,
# and third-party packages without stubs (pandas, antlr) are not required.
files = ["intrepyd/api.py", "intrepyd/context.py", "intrepyd/export.py"]
follow_imports = "silent"
ignore_missing_imports = true
warn_redundant_casts = true

# context.py is held to the strict bar: every def must be annotated. api.py is
# the dynamic ctypes binding and export.py has a few deliberately untyped
# helpers, so they are checked but not required to annotate every def.
[[tool.mypy.overrides]]
module = "intrepyd.context"
disallow_untyped_defs = true

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
include = ["intrepyd*"]
exclude = ["intrepyd.tests", "intrepyd.tests.*"]

[tool.setuptools.package-data]
# fetch_intrepid.py puts the library of one platform there, and only that one
# ends up in the wheel; py.typed (PEP 561) tells type checkers the package
# ships inline annotations
intrepyd = ["libintrepid.so", "intrepid.dll", "LICENSE.intrepid", "py.typed"]
